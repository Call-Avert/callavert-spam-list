name: Rebuild spam list

# Weekly, matching what the app does: the phone fetches this file about once a
# week, so publishing more often would spend GitHub minutes to change a file
# nobody reads any sooner.
#
# Monday 06:00 UTC — after the FTC has posted Friday's and the weekend's data,
# which it folds into the first business day's file.
on:
  schedule:
    # DAILY. This was weekly, which quietly broke the retention promise: a
    # number meant to be released after 14 days could sit on a phone for close
    # to four weeks once a weekly rebuild and a weekly device fetch stacked up.
    # The tier that suffers most is the one-report tier - the entries most
    # likely to be an innocent number somebody spoofed.
    #
    # 06:00 UTC is after the FTC's overnight publish and before most of the US
    # wakes up.
    - cron: "0 6 * * *"
  workflow_dispatch:          # so it can be run by hand without waiting a week

permissions:
  contents: write             # to commit the rebuilt list

concurrency:
  # Two runs at once would race on the same branch and one push would discard
  # the other's. Harmless now that each run recomputes the list from scratch,
  # but a wasted rebuild and a confusing history.
  group: rebuild-list
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The compiler decides which numbers get blocked on other people's
      # phones, and nothing downstream would notice if it got that wrong: a
      # bad list looks exactly like a good one. Both failures it has had -
      # a retention off-by-one and a double-count - published cleanly.
      - name: Test the compiler
        run: python -m unittest discover -s tools -p "test_*.py"

      # NO HISTORY IS CARRIED BETWEEN RUNS, deliberately.
      #
      # It used to be saved as a release asset, and that made the published
      # list depend on the order runs had happened in: expiring a number from
      # the history discarded the reports it had already absorbed, so days
      # already marked "counted" could never contribute again. Rebuilding from
      # the same files in a different order gave a different list - a 5%
      # difference when this was found, with nothing to indicate which was
      # right.
      #
      # Since every run now fetches the whole 120-day window, carrying history
      # buys nothing: no number can outlive the window anyway, because the
      # longest retention IS the window. Each run recomputes from the files
      # alone, which is deterministic, needs no stored state, and repairs
      # itself if anything upstream is ever lost.

      # Fetch the WHOLE retention window, not just what the FTC page still
      # links. The page lists about a month; retention runs to 120 days, so
      # without the date walk the 2- and 3-report tiers could only fill at one
      # day per day and the list sat at roughly a third of its true size.
      #
      # A silently missing tier would not trip either size gate on its own,
      # because the list would still look plausibly large - so the fetch has to
      # be right rather than merely non-empty.
      # Keep the downloaded files between runs. Without this a daily job
      # would pull the whole 120-day window - about 94 MB - off a government
      # file server every morning to learn one new day. The fetcher skips
      # anything already on disk, so a warm cache costs one file.
      #
      # The cache is an optimisation only: the key changes every day and a miss
      # simply re-downloads the window, which is exactly what the very first
      # run does anyway.
      - name: Cache the FTC files
        uses: actions/cache@v4
        with:
          path: ftcdata
          key: ftcdata-${{ github.run_id }}
          restore-keys: ftcdata-

      - name: Fetch the FTC daily files
        run: |
          python tools/fetch_ftc_files.py \
            --out ftcdata \
            --backfill-days 120 \
            --keep-days 130

      - name: Rebuild the list
        run: |
          python tools/build_spam_list.py \
            --input "ftcdata/*.csv" \
            --out spam/current.csv.gz \
            --history "$RUNNER_TEMP/history.csv" \
            --min-reports 1 \
            --retain-1 14 \
            --retain-2 45 \
            --retain-days 120

      # A bad publish cannot be recalled once devices have fetched it, so the
      # list has to clear two gates before it goes out.
      #
      # The absolute floor catches a catastrophic build - a fetch that returned
      # nothing, a parser broken by a column rename.
      #
      # The proportional gate catches the quieter and likelier failure: a
      # regression that shrinks the list without emptying it. Losing most of
      # the list still leaves thousands of numbers, so a fixed floor would wave
      # it straight through while most users silently lost most of their
      # protection. Comparing against what is already published is what makes
      # that visible. A genuine large drop needs a human to look, which is
      # exactly the intent.
      - name: Sanity-check before publishing
        run: |
          COUNT=$(gunzip -c spam/current.csv.gz | grep -vc '^#')
          PREV=$(git show HEAD:spam/current.csv.gz 2>/dev/null \
                 | gunzip -c 2>/dev/null | grep -vc '^#' || true)
          PREV=${PREV:-0}
          echo "list holds $COUNT numbers (previously $PREV)"

          if [ "$COUNT" -lt 500 ]; then
            echo "::error::Only $COUNT numbers — refusing to publish a list this small."
            exit 1
          fi

          if [ "$PREV" -gt 0 ] && [ "$((COUNT * 2))" -lt "$PREV" ]; then
            echo "::error::$COUNT numbers is less than half the published $PREV — refusing to publish. Re-run manually if this drop is expected."
            exit 1
          fi

      - name: Publish
        run: |
          git config user.name  "callavert-list-bot"
          git config user.email "contact@callavert.com"
          git add spam/current.csv.gz
          if git diff --cached --quiet; then
            echo "list unchanged — nothing to publish"
          else
            COUNT=$(gunzip -c spam/current.csv.gz | grep -vc '^#')
            git commit -m "Rebuild: $COUNT numbers ($(date -u +%Y-%m-%d))"
            git push
          fi
